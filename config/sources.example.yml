project:
  timezone: America/Lima
  reporting_currency: PEN
  governed_source_registry: config/source_registry.yml

scope:
  start_date: 2023-01-01
  end_date: 2026-07-31
  full_years:
    - 2023
    - 2024
    - 2025
  ytd_year: 2026
  ytd_cutoff_month: 7
  comparison_periods:
    - 2025-01-01/2025-07-31
    - 2026-01-01/2026-07-31

sources:
  oece_ocds:
    source_id: oece_ocds_seace_v3_bulk
    role: primary
    enabled: true
    source_system: seace_v3
    checksum_scope: uncompressed_json_payload
  oece_complementary_xlsx:
    source_id: oece_complementary_open_data
    role: validation_and_separate_modules
    enabled: false
    note: No combinar granularidades sin una llave y reconciliación documentadas.

storage:
  raw_data_in_git: false
  local_root_env_var: DATA_ROOT
  preserve_source_files: true

pilot:
  source: seace_v3
  source_period: 2026-07
  snapshot_date: 2026-08-19
  formats:
    - csv
    - json
    - sha
