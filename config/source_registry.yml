  - source_id: oece_complementary_open_data
    name: Portal de Datos Abiertos del OECE
    publisher: Organismo Especializado para las Contrataciones Públicas Eficientes (OECE)
    authority: official_publisher
    category: complementary_data
    status: candidate_not_ingested
    used_in_project: false
    purpose: Candidato para validaciones y módulos separados de PAC, proveedores, consorcios, órdenes, entidades y otros conjuntos.
    scope_and_coverage:
      - La ficha oficial declara información desde 2018.
      - La actualización declarada es mensual, dentro de los primeros cinco días del mes.
      - Incluye PAC, procedimientos, contratos, proveedores, consorcios, entidades, órdenes y otros conjuntos.
    limitations:
      - La ficha indica que no incluye procedimientos en curso ni información incompleta de adjudicación.
      - No se combinará con OCDS hasta validar llaves, periodo y granularidad.
      - La URL interna del servicio puede cambiar; se conserva la ficha estable de gob.pe.
    official_urls:
      service_landing: https://www.gob.pe/14272-acceder-al-portal-de-datos-abiertos-del-oece
    formats: [XLSX, OTHER_TABULAR]
    access_method: Acceso a través de la ficha oficial de servicio.
    update_frequency: Mensual, dentro de los primeros cinco días, según la ficha oficial.
    license_or_terms: No confirmados; revisar por dataset antes de usar.
    last_link_verification:
      date: 2026-08-19
      method: HTTP GET y revisión de la ficha oficial
      result: PASS

